<article class="h-entry" id="{{ slug }}">
  <header>
    <h2 class="p-name"><a class="u-url" href="/#{{ slug }}">{{ title }}</a></h2>
    <time class="dt-published" datetime="{{ datetime }}">{{ date }}</time>
    {{ tags }}
  </header>
  <div class="e-content">
    {{ content }}
  </div>
</article>
